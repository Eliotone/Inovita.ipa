name: Inovitec
options:
  bundleIdPrefix: com.inovitec
  deploymentTarget:
    iOS: "16.0"
targets:
  Inovitec:
    type: application
    platform: iOS
    sources: [Inovitec]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inovitec.app
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inovitec
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Inovitec uses Bluetooth to connect your medical chip and smart devices."
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
