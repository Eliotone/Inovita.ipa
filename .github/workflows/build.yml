name: Build IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          xcodebuild -project Inovitec.xcodeproj -scheme Inovitec -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/Inovitec.app Payload/
          zip -r Inovitec.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Inovitec-ipa
          path: Inovitec.ipa
